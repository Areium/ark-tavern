# 世界书文件夹内的逻辑类别注册表。
# 路径均相对于 books/<书 ID>/，不指向共享内容目录。
categories:
  characters: characters/
  races: races/
  classes: classes/
  factions: factions/
  items: items/
  locations: environment/Location/
  weather: environment/weather/
  plots: plots/
  world: world/
  attributes: attributes/
  enemies: enemies/
  combat_nodes: combat/nodes/
  combat_tiles: combat/tiles/
  combat_backgrounds: combat/backgrounds/
  audio: audio/
  rules: rules/

# 层级定义（用于文档管理界面分组）
hierarchy:
  levels:
    - level: 0
      label: 世界观
      categories: [world, rules]
    - level: 1
      label: 基础定义
      categories: [attributes, races, classes, weather]
    - level: 2
      label: 世界实体
      categories: [factions, locations, items]
    - level: 3
      label: 行动者
      categories: [characters]
    - level: 4
      label: 叙事
      categories: [plots, enemies]
    - level: 5
      label: 战斗组件
      categories: [combat_nodes, combat_tiles, combat_backgrounds]
