# data/worldbooks/content/ 类别注册表
# 系统启动时加载此文件，建立 类别ID → 目录 映射。
# 取代旧 data/worldbooks/content/_INDEX.md 中的 index + hierarchy 部分。
categories:
  characters: data/worldbooks/content/characters/
  races: data/worldbooks/content/races/
  classes: data/worldbooks/content/classes/
  factions: data/worldbooks/content/factions/
  items: data/worldbooks/content/items/
  locations: data/worldbooks/content/environment/Location/
  weather: data/worldbooks/content/environment/weather/
  plots: data/worldbooks/content/plots/
  world: data/worldbooks/content/world/
  attributes: data/worldbooks/content/attributes/
  enemies: data/worldbooks/content/enemies/
  combat_nodes: data/worldbooks/content/combat/nodes/
  combat_tiles: data/worldbooks/content/combat/tiles/
  combat_backgrounds: data/worldbooks/content/combat/backgrounds/
  audio: data/worldbooks/content/audio/
  rules: data/worldbooks/content/rules/

# 层级定义（用于文档管理界面分组）
hierarchy:
  levels:
    - level: 0
      label: 世界观
      categories: [world, rules]
    - level: 1
      label: 基础定义
      categories: [attributes, races, classes, weather]
    - level: 2
      label: 世界实体
      categories: [factions, locations, items]
    - level: 3
      label: 行动者
      categories: [characters]
    - level: 4
      label: 叙事
      categories: [plots, enemies]
    - level: 5
      label: 战斗组件
      categories: [combat_nodes, combat_tiles, combat_backgrounds]
